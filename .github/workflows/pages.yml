# Сборка и публикация сайта на GitHub Pages при каждом push в main.
# Требует: Settings → Pages → Source = "GitHub Actions" (включается один раз руками).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:          # ручной перезапуск из вкладки Actions

permissions:
  contents: read
  pages: write                # публиковать на Pages
  id-token: write             # Pages проверяет, что деплой идёт из этого workflow (OIDC)

concurrency:
  group: pages
  cancel-in-progress: false   # не обрывать начатый деплой на полпути

env:
  HUGO_VERSION: 0.170.1       # та же версия, на которой сайт проверен локально

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # тема PaperMod подключена как submodule
          fetch-depth: 0          # полная история: Hugo берёт даты изменения из git
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
